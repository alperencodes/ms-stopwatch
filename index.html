<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Beatmap Millisecond Stopwatch</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="app.js" defer></script>
  </head>
  <body>
    <main class="app">
      <header>
        <p class="eyebrow">BEATMAP TOOL</p>
        <h1>Millisecond Stopwatch</h1>
        <p class="hint"><kbd>Space</kbd> pauses or resumes. <kbd>Y</kbd>, <kbd>Z</kbd>, and <kbd>X</kbd> record notes.</p>
      </header>

      <section class="timer-card" aria-label="Stopwatch">
        <div class="playback-settings">
          <label class="song-picker" for="songSelect">Playback song
            <select id="songSelect">
              <option value="">No song</option>
              <option value="resources/songs/easy.mp3">easy.mp3</option>
              <option value="resources/songs/medium.mp3">medium.mp3</option>
              <option value="resources/songs/hard.mp3">hard.mp3</option>
            </select>
          </label>
          <label class="volume-control" for="volumeSlider">
            <span>Volume <output id="volumeValue" for="volumeSlider">100%</output></span>
            <input id="volumeSlider" type="range" min="0" max="100" step="1" value="100" />
          </label>
          <label class="timeline-control" for="timelineSlider">
            <span>Timeline <output id="timelineValue" for="timelineSlider">0:00.000 / 0:00.000</output></span>
            <input id="timelineSlider" type="range" min="0" max="0" step="0.001" value="0" disabled />
          </label>
        </div>
        <audio id="songAudio" preload="auto"></audio>
        <output id="timer" aria-live="off">0 ms</output>
        <div class="controls">
          <button id="startButton" class="primary" type="button">Start</button>
          <button id="stopButton" type="button" disabled>Stop</button>
          <button id="resetButton" class="danger" type="button">Reset</button>
        </div>
        <p id="status" role="status">Ready</p>
      </section>

      <section class="workspace">
        <form id="metadataForm" autocomplete="off">
          <h2>Beatmap details</h2>
          <label>Song <input id="song" name="song" required /></label>
          <label>Artist <input id="artist" name="artist" required /></label>
          <label>Difficulty
            <select id="difficulty" name="difficulty">
              <option>EASY</option><option selected>MEDIUM</option><option>HARD</option>
            </select>
          </label>
          <div class="field-row">
            <label>BPM <input id="bpm" name="bpm" type="number" min="1" step="any" value="120" required /></label>
            <label>Approach time (ms) <input id="approachTimeMs" name="approachTimeMs" type="number" min="0" step="1" value="1500" required /></label>
          </div>
          <button id="saveButton" class="primary save" type="submit">Save beatmap JSON</button>
        </form>

        <div class="notes-panel">
          <div class="notes-heading">
            <h2>Recorded notes <span id="noteCount">0</span></h2>
            <button id="undoButton" type="button" disabled>Undo last</button>
          </div>
          <ol id="notesList" aria-label="Recorded note timestamps">
            <li class="empty">No notes yet. Start the timer and press Y, Z, or X.</li>
          </ol>
        </div>
      </section>
    </main>
  </body>
</html>
